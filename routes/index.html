<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forest Hills Runners - Running Routes</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIINfQ+7kYVqWozp0Yj8dN2fCJ93U8ZwKp1U="
        crossorigin="">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <section id="hero" class="text-center mb-0">
        <div class="jumbotron d-flex align-items-center background-fixed parallax routes-hero">
            <div class="container text-white animated-text">
                <h1 class="display-4 mt-5">Running Routes</h1>
            </div>
        </div>
    </section>

    <main class="routes-page">
        <section class="routes-content container" aria-label="Interactive running routes">
            <div class="post-thumbnail route-map-frame">
                <div id="route-map" class="route-map" aria-label="Forest Hills Runners route map"></div>
            </div>

            <p class="routes-help">
                Click on the routes listed below for more information and to toggle them on the map.
                Points of interest can be toggled by clicking
                <button type="button" id="toggle-route-pois" class="inline-map-toggle">here</button>.
            </p>

            <div class="routes-toolbar" aria-label="Route map controls">
                <span id="route-status">Loading routes...</span>
                <div>
                    <button type="button" class="btn btn-sm btn-outline-success" id="show-all-routes">Show all routes</button>
                    <button type="button" class="btn btn-sm btn-outline-success" id="hide-all-routes">Hide all routes</button>
                </div>
            </div>

            <div id="map-routes" class="map-routes" aria-live="polite"></div>
        </section>
    </main>

    <script src="../js/header_footer.js"></script>
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""></script>
    <script src="../js/routes.js"></script>
    <script src="../js/scripts.js"></script>
</body>
</html>
