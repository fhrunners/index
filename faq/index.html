    <meta name="twitter:image:alt" content="Forest Hills Runners in Jamaica Plain">
    <link rel="icon" href="../favicon.svg" type="image/svg+xml">

    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <section id="hero" class="text-center mb-5">
        <div class="jumbotron d-flex align-items-center background-fixed parallax" style="background-image: url('../images/hero-background.jpg'); background-size: cover; background-position: center; color: white; height: 40vh;">
            <div class="container text-white animated-text">
                <h1 class="display-4 mt-5">FAQ</h1>
            </div>
        </div>
    </section>

    <main class="new-runner-page faq-page">
        <section id="faq" class="container new-runner-intro faq-intro">
            <p class="new-runner-kicker">Frequently Asked Questions</p>
            <div class="first-run-summary faq-tools">
                <div class="faq-search">
                    <label for="faqSearch">Search FAQs</label>
                    <input id="faqSearch" type="search" placeholder="Try pace, weather, membership..." autocomplete="off">
                </div>
                <div class="faq-filter-group" id="faqFilters" aria-label="FAQ topics"></div>
                <div class="faq-results-bar">
                    <span id="faqStatus" aria-live="polite"></span>
                </div>
            </div>
        </section>

        <section class="container new-runner-section faq-question-section" aria-label="FAQ questions">
            <h2 class="pb-2 border-bottom">Questions</h2>
            <div class="faq-grid" id="faqList">
                <!-- FAQ items will be dynamically inserted here -->
            </div>
        </section>
    </main>

    <script src="../js/scripts.js"></script>
